    <script>
      window.__JARVIS_THEME_PRESETS = {
        omega_cyan:     { label: 'Stark Cyan',      accent: '#00f5ff', secondary: '#8a5cff', dim: '#00c4cc', bg: '#050816', surface: '#0b1020', surfaceLight: '#111832' },
        crimson_mk85:   { label: 'Iron Man Mk-85',  accent: '#ff3b5c', secondary: '#ffb800', dim: '#d92648', bg: '#120408', surface: '#1e0810', surfaceLight: '#2b0d18' },
        emerald_matrix: { label: 'Emerald Matrix',  accent: '#00ffb2', secondary: '#00d4ff', dim: '#00cc8e', bg: '#03100b', surface: '#071d14', surfaceLight: '#0d2c1f' },
        royal_nebula:   { label: 'Quantum Nebula',  accent: '#b86bff', secondary: '#ff4ecd', dim: '#9340e8', bg: '#090416', surface: '#13092a', surfaceLight: '#1d103d' },
        solar_gold:     { label: 'Solar Arc Gold',  accent: '#ffb800', secondary: '#ff6200', dim: '#cc9300', bg: '#100b02', surface: '#1c1405', surfaceLight: '#291e09' },
        arctic_frost:   { label: 'Arctic Frost',    accent: '#38bdf8', secondary: '#818cf8', dim: '#0284c7', bg: '#040d1a', surface: '#0a192e', surfaceLight: '#112645' },
        cyber_punk:     { label: 'Night City Neon', accent: '#fcee0a', secondary: '#ff0055', dim: '#c9bd00', bg: '#09090f', surface: '#131320', surfaceLight: '#1c1c30' },
        rose_quartz:    { label: 'Velvet Rose',     accent: '#ff4ecd', secondary: '#ff7b54', dim: '#d435a7', bg: '#120410', surface: '#1f081b', surfaceLight: '#2e0e29' }
      };

      window.__JARVIS_4K_WALLPAPERS = {
        '4k_quantum_lab':    'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=3840&q=90',
        '4k_cyber_city':     'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=3840&q=90',
        '4k_deep_cosmos':    'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=3840&q=90',
        '4k_obsidian_waves': 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=3840&q=90'
      };

      // 3D & Live Canvas Engine State
      window.__jarvisBgAnim = { raf: null, mode: 'none', preset: '', mouseX: 0, mouseY: 0, accent: '#00f5ff', secondary: '#8a5cff' };
      window.addEventListener('pointermove', function(e) {
        window.__jarvisBgAnim.mouseX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
        window.__jarvisBgAnim.mouseY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
      }, { passive: true });

      window.__startJarvisCanvasBg = function(preset, accent, secondary) {
        const st = window.__jarvisBgAnim;
        st.accent = accent || '#00f5ff';
        st.secondary = secondary || '#8a5cff';
        if (st.raf && st.preset === preset) return;
        if (st.raf) { cancelAnimationFrame(st.raf); st.raf = null; }
        st.preset = preset;

        const canvas = document.getElementById('jarvis-bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w = 0, h = 0;
        const resize = function() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.onresize = resize;

        // Initialize particles/nodes for 3D & Live scenes
        const nodes = [];
        for (let i = 0; i < 120; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          nodes.push({
            x: (Math.random() - 0.5) * 1600,
            y: (Math.random() - 0.5) * 1000,
            z: Math.random() * 1000 + 50,
            theta: theta,
            phi: phi,
            r: 160 + Math.random() * 90,
            s: Math.random() * 2.4 + 1.1,
            v: Math.random() * 2.8 + 1.0
          });
        }
        const rainCols = Math.floor(Math.max(w, 1920) / 22);
        const drops = Array.from({ length: rainCols }, () => Math.random() * -50);
        let t = 0;

        const render = function() {
          st.raf = requestAnimationFrame(render);
          if (document.hidden) return;
          t += 0.015;
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2 + st.mouseX * 42;
          const cy = h / 2 + st.mouseY * 28;
          const c1 = st.accent;
          const c2 = st.secondary;

          if (preset === '3d_quantum_core') {
            // 3D Rotating Quantum Sphere + Bright Core Star + Gyroscopic Rings
            const baseR = Math.min(w, h) * 0.28;
            const rotY = t * 0.75 + st.mouseX * 0.55;
            const rotX = t * 0.5 + st.mouseY * 0.45;

            const coreGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, baseR * 1.15);
            coreGlow.addColorStop(0, '#ffffff');
            coreGlow.addColorStop(0.18, c1);
            coreGlow.addColorStop(0.55, c2 + '55');
            coreGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = coreGlow;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            for (let ring = 0; ring < 4; ring++) {
              ctx.save();
              ctx.rotate(rotY * (ring % 2 === 0 ? 1 : -0.85) + ring * 0.9);
              ctx.scale(1, 0.34 + 0.24 * Math.sin(rotX + ring));
              ctx.beginPath();
              ctx.arc(0, 0, baseR * (0.7 + ring * 0.16), 0, Math.PI * 2);
              ctx.strokeStyle = ring % 2 === 1 ? c2 : c1;
              ctx.globalAlpha = 0.78;
              ctx.lineWidth = 2.4;
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();

            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              const a = n.theta + rotY;
              const b = n.phi + rotX * 0.5;
              const x3 = baseR * Math.sin(b) * Math.cos(a);
              const y3 = baseR * Math.cos(b);
              const z3 = baseR * Math.sin(b) * Math.sin(a) + 420;
              const scale = 390 / Math.max(80, z3);
              const px = cx + x3 * scale;
              const py = cy + y3 * scale;
              ctx.fillStyle = i % 3 === 0 ? c2 : c1;
              ctx.globalAlpha = Math.min(0.95, Math.max(0.25, (580 - z3) / 420));
              ctx.beginPath();
              ctx.arc(px, py, n.s * scale, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          } else if (preset === '3d_cyber_grid') {
            // 3D Perspective Synthwave / Cyber Horizon Grid
            const horizon = h * 0.47 + st.mouseY * 18;
            const sunGrad = ctx.createRadialGradient(cx, horizon - 20, 8, cx, horizon - 20, Math.min(w, h) * 0.32);
            sunGrad.addColorStop(0, c1);
            sunGrad.addColorStop(0.45, c2 + '99');
            sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = c1;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.68;
            ctx.beginPath();
            for (let i = -20; i <= 20; i++) {
              const xTop = cx + i * 26;
              const xBot = cx + i * 215;
              ctx.moveTo(xTop, horizon);
              ctx.lineTo(xBot, h);
            }
            const offset = (t * 42) % 20;
            for (let d = 1; d < 18; d++) {
              const p = Math.pow((d + offset / 20) / 18, 2.05);
              const y = horizon + p * (h - horizon);
              ctx.moveTo(0, y);
              ctx.lineTo(w, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
          } else if (preset === '3d_neural_matrix') {
            // 3D Depth-Projected Neural Constellation
            const pts = [];
            const ry = t * 0.38 + st.mouseX * 0.45;
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              const cosR = Math.cos(ry), sinR = Math.sin(ry);
              const rx = n.x * cosR - (n.z - 500) * sinR;
              const rz = n.x * sinR + (n.z - 500) * cosR + 650;
              if (rz > 80) {
                const sc = 460 / rz;
                pts.push({ x: cx + rx * sc * 0.58, y: cy + n.y * sc * 0.58, sc: sc, c: i % 2 ? c1 : c2 });
              }
            }
            ctx.lineWidth = 1.2;
            for (let i = 0; i < pts.length; i++) {
              const p1 = pts[i];
              ctx.fillStyle = p1.c;
              ctx.globalAlpha = Math.min(0.95, p1.sc * 0.85);
              ctx.beginPath();
              ctx.arc(p1.x, p1.y, Math.max(1.6, 3.0 * p1.sc), 0, Math.PI * 2);
              ctx.fill();
              for (let j = i + 1; j < pts.length; j++) {
                const p2 = pts[j];
                const dx = p1.x - p2.x, dy = p1.y - p2.y;
                const d2 = dx * dx + dy * dy;
                if (d2 < 18500) {
                  ctx.strokeStyle = c1;
                  ctx.globalAlpha = (1 - d2 / 18500) * 0.48;
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              }
            }
            ctx.globalAlpha = 1;
          } else if (preset === '3d_warp_tunnel') {
            // 3D Hyperspace Warp Star Tunnel
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              n.z -= n.v * 8.5;
              if (n.z <= 20) {
                n.z = 950;
                n.x = (Math.random() - 0.5) * 1600;
                n.y = (Math.random() - 0.5) * 1000;
              }
              const k = 370 / n.z;
              const kPrev = 370 / (n.z + n.v * 22);
              const px = cx + n.x * k, py = cy + n.y * k;
              const ox = cx + n.x * kPrev, oy = cy + n.y * kPrev;
              ctx.strokeStyle = i % 3 === 0 ? c2 : c1;
              ctx.globalAlpha = Math.min(0.95, (1000 - n.z) / 700);
              ctx.lineWidth = Math.max(1.4, (1000 - n.z) / 260);
              ctx.beginPath();
              ctx.moveTo(ox, oy);
              ctx.lineTo(px, py);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          } else if (preset === 'live_aurora') {
            // Live Cyber Aurora Waves
            for (let band = 0; band < 4; band++) {
              ctx.beginPath();
              const baseH = h * (0.25 + band * 0.16);
              ctx.moveTo(0, h);
              for (let x = 0; x <= w; x += 24) {
                const y = baseH + Math.sin(x * 0.003 + t * (1.2 + band * 0.3) + band) * 75 + Math.cos(x * 0.007 - t * 0.85) * 40;
                ctx.lineTo(x, y);
              }
              ctx.lineTo(w, h);
              ctx.closePath();
              const grad = ctx.createLinearGradient(0, baseH - 90, 0, h);
              grad.addColorStop(0, (band % 2 === 0 ? c1 : c2) + '77');
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.fill();
            }
          } else if (preset === 'live_matrix_rain') {
            // Live Cyber Matrix Rain
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            const chars = '01JARVISOMEGA987654321HEX';
            for (let i = 0; i < drops.length; i++) {
              const x = i * 24;
              const y = drops[i] * 20;
              ctx.fillStyle = i % 5 === 0 ? c2 : c1;
              ctx.globalAlpha = 0.72;
              const ch = chars[(i + Math.floor(t * 12)) % chars.length];
              ctx.fillText(ch, x, y);
              drops[i] += 0.42;
              if (y > h && Math.random() > 0.975) drops[i] = 0;
            }
            ctx.globalAlpha = 1;
          } else if (preset === 'live_nebula_pulse') {
            // Live Deep Space Nebula Clouds + Stars
            for (let k = 0; k < 3; k++) {
              const nx = w * (0.28 + k * 0.22) + Math.sin(t * 0.65 + k * 2) * 100;
              const ny = h * (0.35 + (k % 2) * 0.25) + Math.cos(t * 0.55 + k) * 80;
              const rad = Math.min(w, h) * 0.48;
              const g = ctx.createRadialGradient(nx, ny, 10, nx, ny, rad);
              g.addColorStop(0, (k % 2 === 0 ? c1 : c2) + '66');
              g.addColorStop(1, 'transparent');
              ctx.fillStyle = g;
              ctx.fillRect(0, 0, w, h);
            }
            for (let i = 0; i < 85; i++) {
              const n = nodes[i];
              const sx = ((n.x + 800) / 1600) * w;
              const sy = ((n.y + 500) / 1000) * h;
              ctx.fillStyle = '#ffffff';
              ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(t * 1.6 + i));
              ctx.beginPath();
              ctx.arc(sx, sy, n.s * 0.85, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
        };
        st.raf = requestAnimationFrame(render);
      };

      window.__stopJarvisCanvasBg = function() {
        const st = window.__jarvisBgAnim;
        if (st.raf) { cancelAnimationFrame(st.raf); st.raf = null; }
        st.preset = '';
      };

      window.__applyJarvisTheme = function(cfg) {
        if (!cfg || typeof cfg !== 'object') return;
        const root = document.documentElement;
        const preset = window.__JARVIS_THEME_PRESETS[cfg.preset] || window.__JARVIS_THEME_PRESETS.omega_cyan;
        const isCustom = cfg.preset === 'custom';
        const accent = (isCustom && cfg.accent) ? cfg.accent : (cfg.accent || preset.accent);
        const secondary = (isCustom && cfg.secondary) ? cfg.secondary : (cfg.secondary || preset.secondary);
        const bg = (isCustom && cfg.bg) ? cfg.bg : (cfg.bg || preset.bg);
        const surface = (isCustom && cfg.surface) ? cfg.surface : (cfg.surface || preset.surface);
        const dim = isCustom ? accent : (preset.dim || accent);
        const surfaceLight = isCustom ? surface : (preset.surfaceLight || surface);

        root.style.setProperty('--color-omega-cyan', accent);
        root.style.setProperty('--color-omega-cyan-dim', dim);
        root.style.setProperty('--color-omega-purple', secondary);
        root.style.setProperty('--color-omega-bg', bg);
        root.style.setProperty('--color-omega-surface', surface);
        root.style.setProperty('--color-omega-surface-light', surfaceLight);

        const iconMode = cfg.icon_mode || 'theme';
        const iconColor = cfg.icon_color || accent;
        const iconGlow = cfg.icon_glow !== undefined ? !!cfg.icon_glow : true;

        root.setAttribute('data-icon-mode', iconMode);
        root.setAttribute('data-icon-glow', iconGlow ? 'true' : 'false');
        root.style.setProperty('--jarvis-icon-color', iconMode === 'custom' ? iconColor : accent);
        root.style.setProperty('--jarvis-icon-glow', (iconMode === 'custom' ? iconColor : accent) + '66');

        // Universal 3D / 4K Photo / Live Video Background Engine
        const bgMode = cfg.bg_mode || 'none';
        const bgPreset = cfg.bg_preset || '3d_quantum_core';
        const bgCustomUrl = cfg.bg_custom_url || '';
        const bgCustomType = cfg.bg_custom_type || 'photo';
        const bgOpacity = cfg.bg_opacity !== undefined ? Number(cfg.bg_opacity) : 0.90;
        const bgBlur = cfg.bg_blur !== undefined ? Number(cfg.bg_blur) : 0;

        root.style.setProperty('--jarvis-bg-opacity', String(bgOpacity));
        root.style.setProperty('--jarvis-bg-blur', String(bgBlur) + 'px');

        const photoEl = document.getElementById('jarvis-bg-photo');
        const videoEl = document.getElementById('jarvis-bg-video');
        const canvasEl = document.getElementById('jarvis-bg-canvas');

        if (bgMode === 'none') {
          root.setAttribute('data-bg-active', 'false');
          window.__stopJarvisCanvasBg();
          if (photoEl) photoEl.style.display = 'none';
          if (videoEl) { videoEl.pause(); videoEl.style.display = 'none'; }
          if (canvasEl) canvasEl.style.display = 'none';
        } else {
          root.setAttribute('data-bg-active', 'true');
          if (bgMode === '3d') {
            if (photoEl) photoEl.style.display = 'none';
            if (videoEl) { videoEl.pause(); videoEl.style.display = 'none'; }
            if (canvasEl) canvasEl.style.display = 'block';
            const scene = bgPreset.startsWith('3d_') ? bgPreset : '3d_quantum_core';
            window.__startJarvisCanvasBg(scene, accent, secondary);
          } else if (bgMode === 'live') {
            if (photoEl) photoEl.style.display = 'none';
            if ((bgPreset === 'custom_video' || bgCustomType === 'video') && bgCustomUrl) {
              window.__stopJarvisCanvasBg();
              if (canvasEl) canvasEl.style.display = 'none';
              if (videoEl) {
                if (videoEl.getAttribute('src') !== bgCustomUrl) {
                  videoEl.setAttribute('src', bgCustomUrl);
                }
                videoEl.style.display = 'block';
                videoEl.play().catch(function() {});
              }
            } else {
              if (videoEl) { videoEl.pause(); videoEl.style.display = 'none'; }
              if (canvasEl) canvasEl.style.display = 'block';
              const liveScene = bgPreset.startsWith('live_') ? bgPreset : 'live_aurora';
              window.__startJarvisCanvasBg(liveScene, accent, secondary);
            }
          } else if (bgMode === 'photo') {
            window.__stopJarvisCanvasBg();
            if (videoEl) { videoEl.pause(); videoEl.style.display = 'none'; }
            if (canvasEl) canvasEl.style.display = 'none';
            if (photoEl) {
              const url = (bgPreset === 'custom_photo' && bgCustomUrl)
                ? bgCustomUrl
                : (window.__JARVIS_4K_WALLPAPERS[bgPreset] || bgCustomUrl || window.__JARVIS_4K_WALLPAPERS['4k_quantum_lab']);
              if (photoEl.getAttribute('src') !== url) {
                photoEl.setAttribute('src', url);
              }
              photoEl.style.display = 'block';
            }
          }
        }

        // Universal Music & Sonic Studio Engine (WebAudio Synth + Custom MP3/Stream + Video BG Audio)
        if (!window.__jarvisMusicEngine) {
          window.__jarvisMusicEngine = {
            ctx: null,
            masterGain: null,
            bassFilter: null,
            timer: null,
            noiseNode: null,
            activePreset: '',
            playing: false,
            ensureCtx: function() {
              if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                this.ctx = new AC();
                this.bassFilter = this.ctx.createBiquadFilter();
                this.bassFilter.type = 'lowshelf';
                this.bassFilter.frequency.value = 110;
                this.bassFilter.gain.value = 0;
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.65;
                this.bassFilter.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);
              }
              if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function() {});
              }
              return this.ctx;
            },
            stopSynth: function() {
              if (this.timer) { clearInterval(this.timer); this.timer = null; }
              if (this.noiseNode) {
                try { this.noiseNode.stop(); this.noiseNode.disconnect(); } catch (e) {}
                this.noiseNode = null;
              }
              this.activePreset = '';
            },
            playChordNote: function(freq, type, dur, vol, detune) {
              const ctx = this.ctx;
              if (!ctx) return;
              const now = ctx.currentTime;
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              const flt = ctx.createBiquadFilter();
              flt.type = 'lowpass';
              flt.frequency.value = type === 'sawtooth' ? 1450 : 2100;
              osc.type = type || 'sine';
              osc.frequency.setValueAtTime(freq, now);
              if (detune) osc.detune.setValueAtTime(detune, now);
              g.gain.setValueAtTime(0.0001, now);
              g.gain.linearRampToValueAtTime(vol, now + Math.min(0.18, dur * 0.2));
              g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
              osc.connect(flt);
              flt.connect(g);
              g.connect(this.bassFilter);
              osc.start(now);
              osc.stop(now + dur + 0.04);
            },
            startSynth: function(preset) {
              const ctx = this.ensureCtx();
              if (!ctx) return;
              if (this.timer && this.activePreset === preset) return;
              this.stopSynth();
              this.activePreset = preset;
              let step = 0;
              const self = this;

              if (preset === 'cyber_rain') {
                try {
                  const bufSize = ctx.sampleRate * 2;
                  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                  const data = buf.getChannelData(0);
                  let lastOut = 0.0;
                  for (let i = 0; i < bufSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 0.14;
                  }
                  const noise = ctx.createBufferSource();
                  noise.buffer = buf;
                  noise.loop = true;
                  const nFilter = ctx.createBiquadFilter();
                  nFilter.type = 'bandpass';
                  nFilter.frequency.value = 900;
                  noise.connect(nFilter);
                  nFilter.connect(this.bassFilter);
                  noise.start();
                  this.noiseNode = noise;
                } catch (e) {}
              }

              const tick = function() {
                if (!self.playing) return;
                if (preset === 'lofi_focus' || preset === 'cyber_rain') {
                  const chords = [
                    [220.0, 261.63, 329.63, 392.0],
                    [174.61, 220.0, 261.63, 349.23],
                    [196.0, 246.94, 293.66, 392.0],
                    [164.81, 207.65, 246.94, 329.63]
                  ];
                  const c = chords[Math.floor(step / 4) % chords.length];
                  if (step % 4 === 0) {
                    c.forEach(function(f, idx) {
                      self.playChordNote(f, 'triangle', 1.85, 0.075, idx * 4 - 6);
                    });
                    self.playChordNote(c[0] * 0.5, 'sine', 1.7, 0.14, 0);
                  }
                  const arp = c[step % c.length] * 2;
                  self.playChordNote(arp, 'sine', 0.42, 0.045, 3);
                } else if (preset === 'synthwave_drive') {
                  const bassNotes = [110.0, 110.0, 87.31, 98.0];
                  const arpNotes = [220.0, 261.63, 329.63, 440.0, 329.63, 261.63, 246.94, 329.63];
                  const b = bassNotes[Math.floor(step / 4) % bassNotes.length];
                  self.playChordNote(b, 'sawtooth', 0.24, 0.12, 0);
                  self.playChordNote(arpNotes[step % arpNotes.length] * 1.5, 'sawtooth', 0.22, 0.06, 6);
                } else if (preset === 'deep_space') {
                  const drones = [
                    [130.81, 196.0, 293.66, 392.0],
                    [146.83, 220.0, 329.63, 440.0],
                    [110.0, 164.81, 246.94, 369.99]
                  ];
                  if (step % 6 === 0) {
                    const d = drones[Math.floor(step / 6) % drones.length];
                    d.forEach(function(f, idx) {
                      self.playChordNote(f, 'sine', 3.4, 0.08, idx * 5 - 7);
                    });
                    self.playChordNote(d[0] * 0.5, 'sine', 3.4, 0.15, 0);
                  }
                } else if (preset === 'stark_tactical') {
                  const pulse = [146.83, 164.81, 196.0, 220.0, 293.66, 220.0, 196.0, 164.81];
                  self.playChordNote(pulse[step % pulse.length], 'triangle', 0.20, 0.095, 0);
                  if (step % 2 === 0) {
                    self.playChordNote(73.42, 'sine', 0.30, 0.16, 0);
                  }
                }
                step++;
              };

              const intervalMs = (preset === 'synthwave_drive' || preset === 'stark_tactical') ? 240 : 480;
              tick();
              this.timer = setInterval(tick, intervalMs);
            },
            sync: function(cfg) {
              const enabled = !!cfg.music_enabled;
              const preset = cfg.music_preset || 'lofi_focus';
              const customUrl = (cfg.music_custom_url || '').trim();
              const vol = cfg.music_volume !== undefined ? Number(cfg.music_volume) : 0.65;
              const loop = cfg.music_loop !== undefined ? !!cfg.music_loop : true;
              const bass = !!cfg.music_bass_boost;
              const bgVidSound = !!cfg.bg_video_sound;

              const audioEl = document.getElementById('jarvis-music-audio');
              const videoEl = document.getElementById('jarvis-bg-video');
              if (videoEl) {
                videoEl.muted = !bgVidSound;
                videoEl.volume = Math.max(0, Math.min(1, vol));
              }

              if (this.masterGain && this.ctx) {
                this.masterGain.gain.setValueAtTime(Math.max(0, Math.min(1, vol)), this.ctx.currentTime);
              }
              if (this.bassFilter && this.ctx) {
                this.bassFilter.gain.setValueAtTime(bass ? 9.5 : 0, this.ctx.currentTime);
              }

              if (!enabled) {
                this.playing = false;
                this.stopSynth();
                if (audioEl) { audioEl.pause(); }
                return;
              }

              this.playing = true;
              if (preset === 'custom_audio' && customUrl) {
                this.stopSynth();
                if (audioEl) {
                  audioEl.loop = loop;
                  audioEl.volume = Math.max(0, Math.min(1, vol));
                  if (audioEl.getAttribute('src') !== customUrl) {
                    audioEl.setAttribute('src', customUrl);
                  }
                  audioEl.play().catch(function() {});
                }
              } else {
                if (audioEl) { audioEl.pause(); }
                this.startSynth(preset);
              }
            }
          };
        }

        const musicEnabled = !!cfg.music_enabled;
        const musicPreset = cfg.music_preset || 'lofi_focus';
        const musicCustomUrl = cfg.music_custom_url || '';
        const musicCustomTitle = cfg.music_custom_title || '';
        const musicVolume = cfg.music_volume !== undefined ? Number(cfg.music_volume) : 0.65;
        const musicLoop = cfg.music_loop !== undefined ? !!cfg.music_loop : true;
        const musicBassBoost = !!cfg.music_bass_boost;
        const bgVideoSound = !!cfg.bg_video_sound;

        try {
          window.__jarvisMusicEngine.sync({
            music_enabled: musicEnabled,
            music_preset: musicPreset,
            music_custom_url: musicCustomUrl,
            music_volume: musicVolume,
            music_loop: musicLoop,
            music_bass_boost: musicBassBoost,
            bg_video_sound: bgVideoSound
          });
        } catch (e) {}

        try {
          localStorage.setItem('jarvis_theme_cfg', JSON.stringify({
            preset: cfg.preset || 'omega_cyan',
            accent: accent,
            secondary: secondary,
            bg: bg,
            surface: surface,
            icon_mode: iconMode,
            icon_color: iconColor,
            icon_glow: iconGlow,
            bg_mode: bgMode,
            bg_preset: bgPreset,
            bg_custom_url: bgCustomUrl,
            bg_custom_type: bgCustomType,
            bg_opacity: bgOpacity,
            bg_blur: bgBlur,
            music_enabled: musicEnabled,
            music_preset: musicPreset,
            music_custom_url: musicCustomUrl,
            music_custom_title: musicCustomTitle,
            music_volume: musicVolume,
            music_loop: musicLoop,
            music_bass_boost: musicBassBoost,
            bg_video_sound: bgVideoSound
          }));
        } catch (e) {}
      };

      // Apply saved theme & background immediately on boot
      try {
        const savedTheme = localStorage.getItem('jarvis_theme_cfg');
        if (savedTheme) {
          window.__applyJarvisTheme(JSON.parse(savedTheme));
        }
      } catch (e) {}

      // 60/120fps Physics Inertia Smooth Wheel Scroller for Settings Modal & Scroll Containers
      (function() {
        const scrollState = new WeakMap();
        function findScrollContainer(target) {
          let el = target;
          while (el && el !== document.body && el !== document.documentElement) {
            if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
              if (el.scrollHeight > el.clientHeight) return null;
            }
            if (
              el.classList && (
                el.classList.contains('jarvis-settings-scroll') ||
                el.classList.contains('jarvis-settings-modal') ||
                el.classList.contains('jarvis-chat-scroll') ||
                el.classList.contains('jarvis-left-sidebar') ||
                el.classList.contains('jarvis-right-panel') ||
                el.classList.contains('jarvis-welcome')
              )
            ) {
              if (el.scrollHeight > el.clientHeight + 2) return el;
            }
            el = el.parentElement;
          }
          return null;
        }

        window.addEventListener('wheel', function(e) {
          if (e.ctrlKey || e.metaKey || e.defaultPrevented) return;
          if (e.deltaMode === 0 && Math.abs(e.deltaY) < 48) return;
          const container = findScrollContainer(e.target);
          if (!container) return;

          const maxScroll = container.scrollHeight - container.clientHeight;
          if (maxScroll <= 0) return;

          e.preventDefault();
          let st = scrollState.get(container);
          if (!st) {
            st = { target: container.scrollTop, current: container.scrollTop, raf: null };
            scrollState.set(container, st);
          } else if (!st.raf) {
            st.current = container.scrollTop;
            st.target = container.scrollTop;
          }

          const step = e.deltaMode === 1 ? e.deltaY * 36 : e.deltaY * 0.92;
          st.target = Math.max(0, Math.min(maxScroll, st.target + step));

          if (!st.raf) {
            container.style.setProperty('scroll-behavior', 'auto', 'important');
            const tick = function() {
              const maxNow = container.scrollHeight - container.clientHeight;
              st.target = Math.max(0, Math.min(maxNow, st.target));
              const diff = st.target - st.current;
              if (Math.abs(diff) > 0.6) {
                st.current += diff * 0.22;
                container.scrollTop = st.current;
                st.raf = requestAnimationFrame(tick);
              } else {
                container.scrollTop = st.target;
                st.current = st.target;
                st.raf = null;
                container.style.removeProperty('scroll-behavior');
              }
            };
            st.raf = requestAnimationFrame(tick);
          }
        }, { passive: false });
      })();

      // Global shortcut: Cmd+N / Ctrl+N for New Thread
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          const btns = Array.from(document.querySelectorAll('button'));
          const newThreadBtn = btns.find(b => b.textContent && b.textContent.includes('New Thread'));
          if (newThreadBtn) {
            newThreadBtn.click();
            console.log('⚡ Keyboard Shortcut: New Thread initiated.');
          }
          setTimeout(() => {
            const ta = document.querySelector('textarea');
            if (ta) ta.focus();
          }, 60);
        }
      });
    </script>
  </body>
